name: agentplayground

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: agentplayground-postgres
    environment:
      POSTGRES_DB: agentplayground
      POSTGRES_USER: agentplayground
      POSTGRES_PASSWORD: agentplayground
    ports:
      - "5432:5432"
    volumes:
      - agentplayground-postgres18-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplayground -d agentplayground"]
      interval: 10s
      timeout: 5s
      retries: 10

  personalagent-api:
    build:
      context: .
      dockerfile: Dockerfile.personalagent-api
    env_file:
      - path: .env.compose
        required: false
    environment:
      PORT: "5100"
    ports:
      - "5100:5100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "PersonalAgent.Api.dll", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30

  personalagent-worker:
    build:
      context: .
      dockerfile: Dockerfile.personalagent-worker
    env_file:
      - path: .env.compose
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      personalagent-api:
        condition: service_healthy
      personalagent-web:
        condition: service_started
    restart: on-failure:5

  personalagent-web:
    build:
      context: .
      dockerfile: Dockerfile.personalagent-web
    env_file:
      - path: .env.compose
        required: false
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      personalagent-api:
        condition: service_healthy
    restart: on-failure:5

volumes:
  agentplayground-postgres18-data:
